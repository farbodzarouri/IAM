server.port=8081

# RADIUS server used by Windows NPS (RADIUS proxy) for Remote Desktop Gateway MFA
radius.port=1812
radius.shared-secret=secret
# Out-of-band mode: Access-Request without User-Password consumes a web/REST MFA pre-authentication approval
radius.mfa.ttl-seconds=60
# In-band mode (RFC 2865 challenge-response): Access-Request with User-Password -> Access-Challenge -> OTP
radius.challenge.ttl-seconds=60
# Optional: interface to bind and comma-separated list of permitted NPS client IPs (empty = any)
radius.bind-address=0.0.0.0
radius.allowed-clients=

# Inbound LDAP directory federation (also used for RADIUS primary credential verification when enabled)
ldap.enabled=false
ldap.url=ldap://localhost:389
ldap.base-dn=dc=example,dc=org
ldap.user-search-filter=(&(objectClass=person)(|(uid={0})(sAMAccountName={0})))
ldap.user-dn-pattern=
ldap.bind-dn=
ldap.bind-password=
ldap.auto-provision=true
ldap.fallback-to-local=false
ldap.connect-timeout-ms=5000
ldap.read-timeout-ms=10000
ldap.referral=ignore
ldap.username-attributes=uid,sAMAccountName
