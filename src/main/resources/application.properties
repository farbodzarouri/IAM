server.port=8081

# Network listener bindings.
# All runtime security policies (lockout, challenge/MFA TTLs, Message-Authenticator, realm stripping,
# default auth mode), RADIUS clients & shared secrets, LDAP directories (user and admin), and
# Admin/User accounts are stored and managed in the database.
radius.port=1812
radius.bind-address=0.0.0.0

# Optional first-boot seeding only when the corresponding database tables are empty
# (pass via environment variables / deployment secrets, or configure via the first-run /setup page):
#   iam.bootstrap.radius.shared-secret=...
#   iam.bootstrap.radius.allowed-clients=...
#   iam.bootstrap.admin.username=...
#   iam.bootstrap.admin.password=...
#   ldap.enabled=true
#   ldap.url=ldaps://directory.internal:636
#   ldap.base-dn=dc=corp,dc=example
