server.port=8081

ldap.enabled=false
ldap.url=ldap://localhost:389
ldap.base-dn=dc=example,dc=org
ldap.user-search-filter=(&(objectClass=person)(|(uid={0})(sAMAccountName={0})))
ldap.user-dn-pattern=
ldap.bind-dn=
ldap.bind-password=
ldap.auto-provision=true
ldap.fallback-to-local=false
ldap.connect-timeout-ms=5000
ldap.read-timeout-ms=10000
ldap.referral=ignore
ldap.username-attributes=uid,sAMAccountName
