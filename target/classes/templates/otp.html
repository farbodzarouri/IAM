<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>OTP Management</title>
</head>
<body>
<h1>OTP Management for <span th:text="${user.username}">User</span></h1>

<div th:if="${user.secret == null}">
    <p>No secret generated yet.</p>
    <form th:action="@{/users/{id}/otp/generate(id=${user.id})}" method="post">
        <button type="submit">Generate Secret</button>
    </form>
</div>

<div th:if="${user.secret != null}">
    <p>Secret: <strong th:text="${user.secret}">SECRET</strong></p>
    <p>Scan this QR code with Google Authenticator or similar app.</p>
    <img th:src="@{'data:image/png;base64,' + ${qrCode}}" />

    <h2>Validate OTP</h2>
    <!-- Note: This form submission is for API endpoint which returns JSON. For a real web app we would use AJAX or a web controller endpoint -->
    <p>Use curl or Postman to validate against /api/otp/validate</p>

</div>

<a href="/users">Back to Users</a>

</body>
</html>
